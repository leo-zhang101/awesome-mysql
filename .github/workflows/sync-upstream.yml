name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Merge upstream updates
        env:
          UPSTREAM_REPOSITORY: shlomi-noach/awesome-mysql
          DEFAULT_BRANCH: master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "$DEFAULT_BRANCH"
          if git merge-base --is-ancestor "upstream/$DEFAULT_BRANCH" HEAD; then
            echo "Already up to date."
            exit 0
          fi
          git merge --no-edit "upstream/$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
